name: Publish rules package
on:
  push:
    branches: [main]
    paths:
      - 'publication-files.json'
      - 'SKILL.md'
      - 'README*.md'
      - 'LICENSE'
      - 'assets/templates/**'
      - 'references/*.md'
      - 'scripts/**'
      - '.github/workflows/publish-rules.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional new rules package tag, for example rules-2026.11.17'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: publish-rules
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets/templates
            references
            scripts
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_workspace.py --mode package --json
      - run: python scripts/publish_rules.py --publish
      - name: Publish a requested versioned package
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_rules.py
